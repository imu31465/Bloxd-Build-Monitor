name: Monitor and archive Bloxd main bundles

on:
  # Validate monitor changes and migrate the bundle archive immediately.
  push:
    paths:
      - scripts/monitor.py
      - scripts/regenerate_historic_diff.py
      - tests/test_monitor.py
      - .diff-preview-request
      - requirements.txt
      - .github/workflows/monitor.yml
      - cloudflare/**
  # Low-frequency fallback. Minute-level detection is handled externally.
  schedule:
    - cron: '41 */6 * * *'
  repository_dispatch:
    types: [bloxd-build-changed]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: bloxd-build-monitor
  # Keep one active run and coalesce newer dispatches into the pending run.
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history; every build snapshot is retained

      - name: Sync checkout with latest main
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout -B main origin/main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run Python tests
        run: python -m unittest discover -s tests -v

      - name: Run Cloudflare Worker parser tests
        working-directory: cloudflare
        run: npm test

      - name: Probe once — archive and push on build change
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          snapshot_and_push() {
            [ -f CHANGES.md ] || printf 'Bloxd build update\n' > CHANGES.md
            git add -A
            commit_title=$(head -n 1 CHANGES.md)
            if [ -z "$commit_title" ]; then
              commit_title="Bloxd build update"
            fi
            git commit -m "$commit_title" -m "Per-file details: CHANGES.md"
            # Keep every build snapshot as a permanent, ordinary commit.
            echo "Build snapshot committed: $(git rev-parse HEAD)"
            git push origin main
          }

          if [ -f .diff-preview-request ]; then
            echo "=== regenerate complete historical readable diff ==="
            python scripts/regenerate_historic_diff.py
            rm .diff-preview-request
            git add -A
            git commit -m "Generate complete historical readable diff report"
            git push origin main
            exit 0
          fi

          echo "=== one-shot probe $(date -u '+%Y-%m-%dT%H:%M:%SZ') ==="
          python scripts/monitor.py
          if [ -n "$(git status --porcelain)" ]; then
            echo "Build change detected — committing and pushing snapshot."
            snapshot_and_push
          else
            echo "All environments unchanged."
          fi
